{% extends "pests/base.html" %}
{% load static %}

{% block css %}
  <link rel="stylesheet" href="{% static 'css/auth/password_reset_done.css' %}">
{% endblock %}

{% block content %}
<div class="container text-center py-5">
  <div class="reset-box p-4 shadow-sm rounded bg-white">
    <h2 class="text-success fw-bold mb-3">Check Your Email</h2>
    <p class="text-muted">We’ve emailed you instructions for setting your password. If you don’t receive an email, please check your spam folder or try again.</p>
    <a href="{% url 'login' %}" class="btn btn-outline-success mt-3">Return to Login</a>
  </div>
</div>
{% endblock %}
