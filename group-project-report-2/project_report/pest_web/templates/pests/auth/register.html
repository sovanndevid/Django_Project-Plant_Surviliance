{% extends "pests/base.html" %}
{% load static %}

{% block css %}
    <link rel="stylesheet" href="{% static "css/style.css" %}">
{% endblock css %}
{% block content %}
<h2>Register</h2>
<form method="post">
  {% csrf_token %}
  <h3>User Info</h3>
  {{ user_form.as_p }}

  <h3>Farm Info</h3>
  {{ farm_form.as_p }}

  <button type="submit">Register</button>
</form>
<p>Already have an account? <a href="{% url 'login' %}">Login</a></p>
{% endblock %}
