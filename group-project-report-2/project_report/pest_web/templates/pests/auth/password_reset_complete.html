{% extends "pests/base.html" %}
{% load static %}

{% block css %}
  <link rel="stylesheet" href="{% static 'css/auth/password_reset_complete.css' %}">
{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="reset-complete-box p-4 shadow-sm rounded bg-white mx-auto" style="max-width: 500px;">
    <h2 class="text-success fw-bold mb-3">Password Reset Complete</h2>
    <p class="mb-3">Your password has been set successfully. You can now log in to your account and continue.</p>
    <a href="{% url 'login' %}" class="btn btn-primary w-100">Log In</a>
  </div>
</div>
{% endblock %}
