<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <title>PlantShield</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {% load static %}
    {% block css %}
    <link rel="stylesheet" href="{%static 'css/style.css'%}">
    
    {% endblock css %}
</head>
<body>
    <!-- Header is start here  -->
        <header class="Start">
            <div class="lefty">
                <a href="{% url 'home' %}">
                    <img src="{% static 'images/logo.png' %}" class="go" alt="PlantShield Logo">
                </a>
                <span class="site">PlantShield</span>
            </div>


           <!-- here is a hamburger menu button for responsiveness  -->
            <button class="small"  id="big">☰</button>
           <nav class="pages" id="edit">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'pest_list' %}">Pests</a>
            <a href="{% url 'about' %}">About</a>
            <a href="{% url 'register' %}">Register</a> 
           </nav>
        
        </header>

    <div>
        <form action="register" method="post">
            {% csrf_token %}

            <input type="text" name="first_name" placeholder="First Name"><br>
            <input type="text" name="first_name" placeholder="Last Name"><br>
            <input type="text" name="first_name" placeholder="Username"><br>
            <input type="email" name="first_name" placeholder="Email"><br>
            <input type="password" name="first_name" placeholder="Password"><br>
            <input type="password" name="first_name" placeholder="Confirm Password"><br>
            <input type="Submit">
    </div> 
</body>
