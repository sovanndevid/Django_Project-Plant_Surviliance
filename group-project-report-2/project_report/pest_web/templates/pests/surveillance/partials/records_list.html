<table class="table table-striped">
    <thead>
        <tr>
            <th>Pest/Disease</th>
            <th>Affected Part</th>
            <th>Severity</th>
            <th>Date</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for record in records %}
        <tr>
            <td>{{ record.pest_disease.name }}</td>
            <td>{{ record.affected_plant_part.name }}</td>
            <td>{{ record.get_severity_display }}</td>
            <td>{{ record.created_at|date:"SHORT_DATE_FORMAT" }}</td>
            <td>
                <button class="btn btn-sm btn-warning edit-btn" data-id="{{ record.id }}">Edit</button>
                <button class="btn btn-sm btn-danger delete-btn" data-id="{{ record.id }}">Delete</button>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="5">No records found</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
