{% extends "pests/base.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/plist.css' %}" />
<section class="pest-list container my-5">
  <h2 class="text-center fw-bold mb-4">Explore the 7 Plant Pests & Diseases</h2>

  <!-- Search bar -->
  <div class="row justify-content-center mb-4">
    <div class="col-md-6">
      <form method="get" class="d-flex">
        <input type="text" name="q" class="form-control me-2" placeholder="Search pests..." value="{{ request.GET.q }}">
        <button type="submit" class="btn btn-primary">Search</button>
      </form>
    </div>
  </div>

  <!-- Pest list -->
  <div class="row g-3">
    {% for pest in pests %}
      <div class="col-md-4">
        <div class="card shadow-sm border-0 h-100 p-3">
          <h5 class="card-title">{{ pest.name }}</h5>
          <p class="card-text text-muted small">{{ pest.scientific_name }}</p>
          <a href="{% url 'pest_detail' pest.pk %}" class="btn btn-sm btn-outline-primary mt-2">View Details</a>
        </div>
      </div>
    {% empty %}
      <p class="text-center text-muted">No pests found matching your search.</p>
    {% endfor %}
  </div>
</section>
{% endblock %}
