{% extends "pests/base.html" %}
{% load static %}

{% block css %}
    <link rel="stylesheet" href="{% static "css/style.css" %}">
{% endblock css %}

{% block content %}
<div class="zero">
 
    
    <h2 class="head1">Common Threats to Mango Health</h2>
    <ul class="box">

        {% for pest in pests %}
        
        <li class="list1"><br>
            <a href="{% url "pest_list" pest.pk %}">{{ pest.name }} </a><br>
            <p>             {{ pest.description }}
            </p><br>
            
            <button onclick="location.href='{% url "pest_list" pest.pk %}'">Learn More ↣</button>
        </li>
        {% endfor %}
    </ul>

    
</div>
{% endblock %}
